# KataGo settings for GoGame's computer opponent (round.ai.katago in base.conf).
#
# Based on KataGo's gtp_human5k_example.cfg. KataGo runs with two networks: the
# normal one, for full strength and for counting, and the human-style one
# (-human-model), which plays like a human of a given rank.
#
# The server changes these per move, depending on the computer level:
#   humanSLProfile         the rank to imitate (rank_20k ... rank_9d)
#   humanSLChosenMoveProp  1.0 = pick human-like moves, 0.0 = full strength
#   maxVisits              search size
# and sets the rules itself (area scoring, positional superko, no suicide).
# See round.ai.katago.levels in base.conf.
#
# Paths are relative to round.ai.katago.work_dir (katago/ by default).

# Logs. Set logAllGTPCommunication = true to see every command the server sends.
logDir = gtp_logs
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = false

# Rules: overridden by the server with kata-set-rules
rules = chinese

# Resign only lost games: the server can also turn resigning off (resign = false)
allowResignation = true
resignThreshold = -0.99
resignConsecTurns = 20
resignMinScoreDifference = 40
resignMinMovesPerBoardArea = 0.4

# Search: overridden per level by the server
maxVisits = 40
# one search thread per CPU core is a good start (also the number of CPU threads
# the CPU builds use for the network)
numSearchThreads = 4
ponderingEnabled = false
lagBuffer = 1.0
delayMoveScale = 0.0
delayMoveMax = 0.0

# Human-like play
humanSLProfile = rank_5k
humanSLChosenMoveProp = 1.0
humanSLChosenMoveIgnorePass = true
humanSLChosenMovePiklLambda = 100000000
humanSLRootExploreProbWeightless = 0.0
humanSLRootExploreProbWeightful = 0.0
humanSLPlaExploreProbWeightless = 0.0
humanSLPlaExploreProbWeightful = 0.0
humanSLOppExploreProbWeightless = 0.0
humanSLOppExploreProbWeightful = 0.0
humanSLCpuctExploration = 0.50
humanSLCpuctPermanent = 0.2

# Some randomness, so games differ
chosenMoveTemperatureEarly = 0.85
chosenMoveTemperature = 0.70
chosenMoveTemperatureHalflife = 80
chosenMoveTemperatureOnlyBelowProb = 0.01
chosenMoveSubtract = 0
chosenMovePrune = 0

nnCacheSizePowerOfTwo = 17
nnMutexPoolSizePowerOfTwo = 14
ignorePreRootHistory = false
analysisIgnorePreRootHistory = false
rootNumSymmetriesToSample = 2
useLcbForSelection = false
winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.30
dynamicScoreUtilityFactor = 0.00
useUncertainty = false
subtreeValueBiasFactor = 0.0
useNoisePruning = false
