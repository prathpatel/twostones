# KataGo settings for GoGame's computer opponent (round.ai.katago in base.conf).
#
# KataGo runs as an analysis engine (katago analysis): one process for every game against
# the computer. The server sends it each position as a query and picks the move from its
# answer, so many people can play the computer at the same time. Based on KataGo's
# analysis_example.cfg. KataGo runs with two networks: the normal one, for full strength
# and for counting, and the human-style one (-human-model), which plays like a human of a
# given rank.
#
# The server sets these per query, depending on the computer level:
#   humanSLProfile   the rank to imitate (rank_20k ... rank_9d)
#   maxVisits        search size
# and the rules (area scoring, positional superko, no suicide). See round.ai.katago.levels
# in base.conf.
#
# Paths are relative to round.ai.katago.work_dir (katago/ by default).

# Logs. Set logAllRequests and logAllResponses = true to see every query and answer.
# (The folder keeps the name it had when KataGo ran in GTP mode: the service may write there.)
logDir = gtp_logs
logAllRequests = false
logAllResponses = false
logSearchInfo = false
logToStderr = false

# The server reads winrates and ownership from Black's point of view
reportAnalysisWinratesAs = BLACK

# Parallelism: how many positions (one per game waiting for the computer) KataGo searches
# at the same time, and with how many threads each. More positions in parallel serve more
# games at once; their network evaluations are batched together, which is what makes a GPU
# fast. CPU: numAnalysisThreads around the number of cores. GPU: 16 to 64 or more. Keep
# nnMaxBatchSize >= numAnalysisThreads * numSearchThreadsPerAnalysisThread.
numAnalysisThreads = 8
numSearchThreadsPerAnalysisThread = 1
nnMaxBatchSize = 16

# Search: maxVisits is set per query by the server
maxVisits = 32
# no exploration noise: this is for playing, not for showing alternatives
wideRootNoise = 0.0
rootNumSymmetriesToSample = 2

# Human-style network: the rank is set per query
humanSLProfile = rank_5k

nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
